<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RascaYa V9 - Ganá Plata Real</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      min-height: 100vh;
    }
    h1 { margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  .saldo-box {
      background: #fff;
      color: #764ba2;
      padding: 15px 30px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    #scratchCard {
      position: relative;
      width: 300px;
      height: 200px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    #prize {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #764ba2;
      background: #ffd700;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
      touch-action: none;
    }
    button {
      margin-top: 15px;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      width: 300px;
    }
    button:active { transform: scale(0.95); }
    #scratchButton { background: #ff4757; }
    #withdrawBtn { background: #2ed573; display: none; }
    #withdrawBtn:disabled { background: #aaa; cursor: not-allowed; }
    small { margin-top: 10px; opacity: 0.8; }
  </style>
</head>
<body>
  <h1>🎰 RascaYa V9 🎰</h1>
  <p>Cada raspada = $50</p>

  <div class="saldo-box">Saldo: $<span id="saldo">0</span></div>

  <div id="scratchCard">
    <div id="prize">+$50</div>
    <canvas id="canvas" width="300" height="200"></canvas>
  </div>

  <button id="scratchButton">RASCAR +$50</button>
  <button id="withdrawBtn" onclick="retirar()">RETIRAR $500 POR WHATSAPP</button>

  <small>Mínimo de retiro: $500</small>

  <script>
    // Lógica Saldo
    let saldo = parseInt(localStorage.getItem('saldo') || '0');
    const saldoSpan = document.getElementById('saldo');
    const withdrawBtn = document.getElementById('withdrawBtn');
    const WHATSAPP_NUMERO = '5492983389710'; // <-- TU WHATSAPP

    function actualizarSaldo() {
      saldoSpan.textContent = saldo;
      localStorage.setItem('saldo', saldo);
      if (saldo >= 500) {
        withdrawBtn.style.display = 'block';
      }
    }
    actualizarSaldo();

    // Lógica del raspado
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let raspado = false;

    function resetCanvas() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#c0c0c0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#888';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('RASPA AQUÍ', 150, 100);
      ctx.globalCompositeOperation = 'destination-out';
      raspado = false;
    }
    resetCanvas();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
      return {x, y};
    }

    function scratch(e) {
      if (!isDrawing || raspado) return;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 20, 0, Math.PI * 2);
      ctx.fill();

      // Si raspó más del 50% damos los $50 1 sola vez
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let transparent = 0;
      for (let i = 3; i < imageData.data.length; i += 4) {
        if (imageData.data[i] === 0) transparent++;
      }
      if (transparent > (canvas.width * canvas.height) / 2 &&!raspado) {
        raspado = true;
        saldo += 50;
        actualizarSaldo();
        setTimeout(resetCanvas, 800);
      }
    }

    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('touchstart', () => isDrawing = true);
    canvas.addEventListener('touchend', () => isDrawing = false);
    canvas.addEventListener('touchmove', scratch);

    document.getElementById('scratchButton').addEventListener('click', () => {
      if(!raspado) resetCanvas(); // Reset si no raspó nada
    });

    // Función Retiro WhatsApp
    function retirar() {
      const mensaje = `Hola! Quiero retirar $500 de RascaYa. Mi saldo actual es: $${saldo}`;
      const url = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
  </script>

  <!-- === ADS TERRA CÓDIGOS - NO TOCAR === -->
  <script type='text/javascript' src='https://pl30177520.effectivecpmnetwork.com/ae/77/e5/ae77e5f080a85cc8c64e8078e147b5f8.js'></script>
  <script>
    const btnRascar = document.getElementById('scratchButton');
    const directLink = 'https://www.effectivecpmnetwork.com/fxczk31aq?key=7d8070488594088b20dd155bec2127e6';
    btnRascar.addEventListener('click', function() {
      window.open(directLink, '_blank');
    }, { once: false });
  </script>
  <!-- === FIN ADS TERRA === -->

</body>
</html>
